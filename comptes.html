<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comptes Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4ECE0; --card:#FBF7F0; --ink:#3B2418; --brown:#8B5E3C; --taupe:#B79F86;
    --muted:#85705F; --faint:#B5A593; --line:#E3D5C3; --sand:#EADFCF; --ok:#6E7F4B; --warn:#C08A2E; --danger:#A4452F;
    --text:#3B2418;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{min-height:100vh;color:var(--ink);font-family:'Inter',-apple-system,sans-serif;font-size:14.5px;line-height:1.5;background:var(--bg);}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 20px 80px;}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .pill-tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 13px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--muted);}
  .pill-tag.v,.pill-tag.o{color:var(--muted);border-color:var(--line);background:var(--card);}
  .back{color:var(--muted);text-decoration:none;font-size:13px;padding:6px 4px;}
  .back:hover{color:var(--ink);}

  .hero{text-align:center;padding:26px 0 8px;}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(44px,9vw,72px);letter-spacing:.01em;margin:0;color:var(--ink);line-height:1;}
  .sub{color:var(--muted);letter-spacing:.22em;text-transform:uppercase;font-size:11px;margin:10px 0 0;}
  .rule{width:56px;height:1px;background:var(--taupe);margin:22px auto 26px;}

  .models{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;}
  .mcard{
    width:200px;text-align:center;padding:20px 14px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);
    cursor:pointer;font:inherit;color:inherit;transition:box-shadow .15s, border-color .15s;
  }
  .mcard:hover{box-shadow:0 10px 26px rgba(59,36,24,.10);border-color:var(--taupe);}
  .mcard.on{background:var(--ink);border-color:var(--ink);color:#F4ECE0;box-shadow:0 10px 26px rgba(59,36,24,.18);}
  .mcard .ico{width:50px;height:50px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;background:var(--sand);border:1px solid var(--line);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:26px;}
  .mcard b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:24px;color:inherit;line-height:1.1;}
  .mcard small{display:block;font-size:12px;color:var(--muted);margin-top:4px;}
  .mcard .n{font-size:12px;font-weight:500;margin-top:10px;display:inline-block;padding:2px 12px;border-radius:999px;background:var(--sand);color:var(--muted);}
  .mcard.on small{color:#D9C8B4;} .mcard.on .n{background:rgba(244,236,224,.16);color:#F4ECE0;} .mcard.on .ico{background:rgba(244,236,224,.14);border-color:rgba(244,236,224,.25);color:#F4ECE0;}

  .foot-note{text-align:center;color:var(--faint);font-size:12px;margin:20px 0 0;}
  .demo{display:inline-block;margin-top:6px;color:var(--warn);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12.5px;}

  .panel{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 22px 10px;box-shadow:0 14px 34px rgba(59,36,24,.06);}
  .tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .search{flex:1;min-width:220px;border:1px solid var(--line);border-radius:999px;padding:10px 18px;font:inherit;font-size:14px;background:#fff;color:var(--ink);}
  .search:focus{outline:2px solid #D9C3A8;border-color:var(--taupe);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 15px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;}
  .chip:hover{border-color:var(--taupe);}
  .chip.on{background:var(--ink);color:#F4ECE0;border-color:var(--ink);}

  .group{margin-top:26px;}
  .group-head{display:flex;align-items:baseline;gap:10px;padding-bottom:6px;}
  .gdot{display:none;}
  .group-head h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px;margin:0;color:var(--ink);line-height:1.1;}
  .group-head span.c{font-size:12px;color:var(--muted);}
  .grid{display:grid;grid-template-columns:44px minmax(200px,1.3fr) 120px minmax(260px,1.6fr);gap:14px;align-items:center;}
  .colhead{padding:4px 6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);}
  .row{padding:11px 6px;border-top:1px solid var(--line);border-radius:0;}
  .row:hover{background:rgba(234,223,207,.35);}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--sand);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:19px;color:var(--brown);object-fit:cover;}
  .name{display:flex;align-items:center;gap:8px;min-width:0;}
  .name a{color:var(--ink);font-weight:500;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .name a:hover{text-decoration:underline;}
  .name .num{color:var(--brown);font-weight:600;}
  .avatar.pick{cursor:pointer;}
  .name small{display:block;font-size:12px;color:var(--faint);}
  .st-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 9px;font-size:12px;background:#fff;cursor:pointer;font-family:inherit;color:var(--ink);}
  .st-pill:hover{border-color:var(--taupe);}
  .dot{width:8px;height:8px;border-radius:50%;}
  .dot.actif{background:var(--ok);} .dot.restriction{background:var(--warn);} .dot.desactive{background:var(--danger);} .dot.appel{background:#E8833A;}
  .copy{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;color:var(--muted);}
  .copy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cbtn{border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--muted);font-size:11.5px;padding:2px 9px;border-radius:999px;font-family:'Inter',sans-serif;flex-shrink:0;}
  .cbtn:hover{background:var(--ink);border-color:var(--ink);color:#F4ECE0;}
  .empty{color:var(--faint);font-style:italic;padding:30px 0;text-align:center;}

  @media(max-width:760px){
    .colhead{display:none;}
    .row.grid{grid-template-columns:44px 1fr auto;grid-template-areas:"av name st" ". mail mail";row-gap:4px;}
    .row .avatar{grid-area:av;} .row .name{grid-area:name;} .row .st{grid-area:st;} .row .mail{grid-area:mail;} .row .phone{grid-area:phone;}
    .panel{padding:16px 14px 6px;} .hero{padding-top:18px;} .mcard{width:calc(50% - 8px);min-width:140px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="pill-tag v" id="tagUpdate">Mis à jour</span>
    <a class="back" href="index.html">← Tableau de bord</a>
    <span class="pill-tag o" id="tagCount"></span>
  </div>

  <header class="hero">
    <h1>Comptes Instagram</h1>
    <p class="sub">Comptes · Modèles · Statuts</p>
    <div class="rule"></div>
    <div class="models" id="models"></div>
    <p class="foot-note">Clique sur un modèle pour filtrer · clique sur un statut pour le changer</p>
  </header>

  <section class="panel">
    <div class="tools"><input class="search" id="search" type="search" placeholder="Chercher un profil, un mail, un numéro…"></div>
    <div class="chips" id="chips"></div>
    <div id="groups"></div>
  </section>
</div>
<script>
const ACCOUNTS_KEY = 'dashboard-accounts-v1';
const STATUS = { actif:'Actif', appel:'Appel', restriction:'Restriction', desactive:'Désactivé' };
const ORDER = ['actif','appel','restriction','desactive'];
const COLORS = ['blue','violet','orange','green'];
const HEX = { blue:'#8FB4F5', violet:'#B7A0F3', orange:'#F5B681', green:'#86D4B2' };
const DEMO = [];
let accounts = [], demo = false, fModel = 'Tous', fStatus = 'Tous', q = '';
try{ const raw = localStorage.getItem(ACCOUNTS_KEY); accounts = raw ? JSON.parse(raw) : []; }catch(e){ accounts = []; }

const esc = (s) => { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
const modelOf = (a) => a.model || 'Sans modèle';
function save(){ if(demo) return true; try{ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(accounts)); return true; }catch(e){ return false; } }
document.getElementById('tagUpdate').textContent = 'Mis à jour le ' + new Date().toLocaleDateString('fr-FR');

function render(){
  const names = [...new Set(accounts.map(modelOf))];
  const colorOf = (m) => COLORS[names.indexOf(m) % COLORS.length];
  const nActive = accounts.filter(a => a.status === 'actif').length;
  document.getElementById('tagCount').textContent = accounts.length + ' comptes · ' + nActive + ' actifs';
  document.getElementById('models').innerHTML = names.map(m => {
    const list = accounts.filter(a => modelOf(a) === m);
    const act = list.filter(a => a.status === 'actif').length;
    const other = list.length - act;
    return `<button class="mcard c-${colorOf(m)}${fModel === m ? ' on' : ''}" data-m="${esc(m)}">
      <div class="ico">${esc(m[0].toUpperCase())}</div>
      <b>${esc(m)}</b>
      <small>${act} actif${act > 1 ? 's' : ''}${other ? ' · ' + other + ' à surveiller' : ''}</small>
      <span class="n">${list.length} compte${list.length > 1 ? 's' : ''}</span>
    </button>`; }).join('');
  document.getElementById('chips').innerHTML =
    ['Tous'].concat(names).map(m => '<button class="chip' + (fModel === m ? ' on' : '') + '" data-m="' + esc(m) + '">' + (m === 'Tous' ? 'Tous les modèles' : esc(m)) + '</button>').join('') +
    '<span style="width:10px"></span>' +
    ['Tous'].concat(ORDER).map(s => '<button class="chip' + (fStatus === s ? ' on' : '') + '" data-s="' + s + '">' + (s === 'Tous' ? 'Tous les statuts' : STATUS[s]) + '</button>').join('');
  const term = q.trim().toLowerCase();
  const list = accounts.filter(a =>
    (fModel === 'Tous' || modelOf(a) === fModel) &&
    (fStatus === 'Tous' || a.status === fStatus) &&
    (!term || [a.name, a.mail, a.phone, a.model, a.notes].join(' ').toLowerCase().includes(term)));
  const box = document.getElementById('groups');
  if(!list.length){ box.innerHTML = '<div class="empty">' + (accounts.length ? 'Aucun compte ne correspond.' : 'Aucun compte pour l\'instant. Importe ton Excel depuis le tableau de bord.') + '</div>'; return; }
  const by = {};
  list.sort((x,y)=>(parseInt(x.num)||1e9)-(parseInt(y.num)||1e9));
  list.forEach(a => { (by[modelOf(a)] = by[modelOf(a)] || []).push(a); });
  box.innerHTML = Object.keys(by).map(m => `
    <div class="group">
      <div class="group-head"><span class="gdot" style="background:${HEX[colorOf(m)]}"></span><h2>${esc(m)}</h2><span class="c">${by[m].length} compte${by[m].length > 1 ? 's' : ''}</span></div>
      <div class="grid colhead"><span></span><span>Profil</span><span>Statut</span><span>Mail</span></div>
      ${by[m].map(a => { const handle = a.name.replace(/^@/,''); return `
        <div class="grid row">
          ${a.photo ? `<img class="avatar pick" data-pick="${esc(a.id)}" title="Changer la photo" src="${a.photo}" alt="">` : `<div class="avatar pick" data-pick="${esc(a.id)}" title="Ajouter une photo">${esc((handle[0] || '?').toUpperCase())}</div>`}
          <div class="name"><div style="min-width:0"><a href="https://www.instagram.com/${encodeURIComponent(handle)}/" target="_blank" rel="noopener">${a.num ? `<b class="num">${esc(a.num)}</b>` : '@'}${esc(handle)}</a>${a.notes ? `<small>${esc(a.notes)}</small>` : ''}</div><button class="cbtn" data-copy="${esc(handle)}">copier</button></div>
          <div class="st"><button class="st-pill" data-id="${esc(a.id)}"><span class="dot ${a.status}"></span>${STATUS[a.status] || a.status}</button></div>
          <div class="copy mail">${a.mail ? `<span>${esc(a.mail)}</span><button class="cbtn" data-copy="${esc(a.mail)}">copier</button>` : '<span style="color:var(--faint)">—</span>'}</div>

        </div>`; }).join('')}
    </div>`).join('');
}
let pickId = null;
const pf = document.createElement('input'); pf.type = 'file'; pf.accept = 'image/*'; pf.style.display = 'none'; document.body.appendChild(pf);
pf.addEventListener('change', () => {
  const file = pf.files[0], a = accounts.find(x => x.id === pickId); pf.value = '';
  if(!file || !a) return;
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const side = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = Math.min(160, side);
    c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, c.width, c.height);
    URL.revokeObjectURL(url);
    a.photo = c.toDataURL('image/jpeg', 0.82);
    if(!save()) alert('Photo non enregistrée : la mémoire du navigateur est pleine.');
    render();
  };
  img.src = url;
});
document.addEventListener('click', async (e) => {
  if(e.target.dataset && e.target.dataset.pick){ pickId = e.target.dataset.pick; pf.click(); return; }
  const card = e.target.closest('[data-m]');
  const t = e.target;
  if(card){ fModel = (fModel === card.dataset.m && card.classList.contains('mcard')) ? 'Tous' : card.dataset.m; render(); }
  else if(t.dataset.s){ fStatus = t.dataset.s; render(); }
  else if(t.closest('.st-pill')){
    const a = accounts.find(x => x.id === t.closest('.st-pill').dataset.id);
    a.status = ORDER[(ORDER.indexOf(a.status) + 1) % ORDER.length]; save(); render();
  } else if(t.dataset.copy){
    try{ await navigator.clipboard.writeText(t.dataset.copy); const old = t.textContent; t.textContent = 'copié ✓'; setTimeout(() => t.textContent = old, 1200); }catch(err){}
  }
});
document.getElementById('search').addEventListener('input', (e) => { q = e.target.value; render(); });
render();
</script>
</body>
</html>
